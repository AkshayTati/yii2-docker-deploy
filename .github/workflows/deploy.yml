name: Deploy Yii2 App

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: akshaytati02/yii2-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t akshaytati/yii2-app:latest .

      - name: Push Docker image
        run: docker push akshaytati/yii2-app:latest

      - name: SSH into EC2 and update Docker Swarm service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull $IMAGE_NAME:latest
            docker service update --image $IMAGE_NAME:latest yii2_app || \
              docker service create --name yii2_app -p 8000:80 $IMAGE_NAME:latest

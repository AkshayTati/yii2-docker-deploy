server {
    listen 80;
    server_name 18.233.170.236;  # Replace with your EC2 IP or domain if needed

    location / {
        proxy_pass http://localhost:8080;  # assuming your Yii2 container runs on 8080
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
